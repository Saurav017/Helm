[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helmx"
version = "0.1.0"
description = "Terminal-first agentic orchestration runtime & multi-agent control plane."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Helm Contributors" },
]
keywords = ["ai", "agents", "mcp", "orchestration", "cli", "multi-agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
google = ["google-genai>=1.0"]
all-providers = ["helmx[openai,anthropic,google]"]
dev = [
    "helmx[all-providers]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.scripts]
helmx = "helm.cli.app:main"

[project.urls]
Homepage = "https://github.com/YOUR_ORG/helm"
Documentation = "https://github.com/YOUR_ORG/helm/tree/main/docs"
Repository = "https://github.com/YOUR_ORG/helm"
Issues = "https://github.com/YOUR_ORG/helm/issues"

# --- Ruff ---
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # pydocstyle — enable incrementally later
    "CPY001",   # missing copyright notice — not required for this project
    "COM812",   # trailing comma (conflicts with formatter)
    "ISC001",   # implicit string concat (conflicts with formatter)
    "T201",     # print found — CLI tool uses print
    "FBT001",   # boolean positional arg — Typer pattern requires this
    "FBT002",   # boolean default positional arg — Typer pattern requires this
    "BLE001",   # blind exception — handled at CLI top-level intentionally
    "TC001",    # TYPE_CHECKING block — runtime imports used at runtime intentionally
    "TC002",    # TYPE_CHECKING block — third-party runtime imports used at runtime
    "TC003",    # TYPE_CHECKING block — stdlib runtime imports used at runtime
    "TC005",    # empty TYPE_CHECKING block — not applicable
    "PLR0913",  # too many function args — safety gate legitimately needs them
    "PLR0912",  # too many branches — rule-based classifiers legitimately branch
    "PLR0911",  # too many return statements — rule-based classifiers legitimately return early
    "C901",     # too complex — classifier pattern
    "TRY003",   # long messages in exceptions
    "TRY301",   # abstract raise to inner function
    "EM101",    # string literals in exceptions
    "EM102",    # f-string literals in exceptions
    "ERA001",   # false positives on comment headers like '# Step 1: initialize'
    "N818",     # exception suffix — CircuitBreakerTripped is established name
    "RUF100",   # unused noqa — cleaned up per file
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # assert used in tests
    "ANN",      # type annotations relaxed in tests
    "PLR2004",  # magic numbers in tests
    "PLC0415",  # imports inside test functions
    "PT019",    # fixture without value injected as parameter (patch)
    "ARG005",   # unused lambda argument in tests
    "E501",     # line length in test mock data
]

# --- Mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
]

# --- Coverage ---
[tool.coverage.run]
source = ["helm"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 0  # Set to 80 once test suite matures
